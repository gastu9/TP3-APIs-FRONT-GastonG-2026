<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <header class="parte-arriba">
        <div class="espacio-titulo">
            <img class="titulo-starwars" src="https://upload.wikimedia.org/wikipedia/commons/5/5a/Star_Wars_Logo..png?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="">
        </div>

        <div class="espacio-buscador-selector">
            <select id="selectorTipo" class="selector-tipo">
                <option value="people">Personajes</option>
                <option value="starships">Naves</option>
                <option value="planets">Planetas</option>
            </select>
        
            <input type="search" class="buscador" id="buscador" placeholder="Buscar por nombre">    
        </div>
        <div class="espacio-imagen">
            <img class="imagen-sable" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/d/df/Dueling_lightsabers.svg/1280px-Dueling_lightsabers.svg.png?utm_source=es.wikipedia.org&utm_campaign=index&utm_content=thumbnail" alt="">
        </div>

    </header>

    <div class="espacio-info-container">
        <main class="info-container" id="infoContainer">
            <!-- Contenido Dinamico -->
        </main>    
    </div>
    


    <script src="main.js"></script>
</body>
</html>
